<body>
    <script>
        function estPremier(n) {
  if (n < 2) return false; 

  let i = 2;
  while (i <= Math.sqrt(n)) {
    if (n % i === 0) {
      return false; 
    }
    i++ ;
  }

  return true;
}


let nombre = 19;
if (estPremier(nombre)) {
  console.log(nombre + " est un nombre premier.");
} else {
  console.log(nombre + " n'est pas un nombre premier.");
}

    </script>
</body>
